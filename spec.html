<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDF 2027 CIS — 品牌色彩計畫（完整規範）</title>
  <link rel="icon" href="design-system/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system/fonts/fonts.css">
  <link rel="stylesheet" href="design-system/tokens.css">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--surface);color:var(--fg);font-family:var(--font-body);font-size:var(--text-base);line-height:var(--leading-body)}
    .nav{position:sticky;top:0;z-index:2;display:flex;min-height:60px;background:var(--bg);border-bottom:var(--tdf-line) solid var(--border)}
    .nav a{display:inline-flex;align-items:center;gap:var(--space-3);padding:0 var(--space-5);color:var(--fg-2);font-weight:700;text-decoration:none;border-right:var(--tdf-line) solid var(--border)}
    .nav a img{width:32px;height:32px}
    .nav a b{background:var(--accent);border:3px solid var(--border);padding:0 var(--space-2);line-height:1.2}
    .nav a.sub{font-size:var(--text-sm);letter-spacing:.06em;text-transform:uppercase;border-right:1px solid var(--border-soft)}
    .nav a:hover{background:var(--surface)}
    main{max-width:880px;margin:0 auto;padding:var(--space-12) var(--container-gutter-desktop) var(--section-y-desktop)}
    article{background:var(--bg);border:var(--tdf-line) solid var(--border);padding:var(--space-8)}
    h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:var(--leading-tight);letter-spacing:var(--tracking-display);text-transform:uppercase;color:var(--fg-2);margin:var(--space-12) 0 var(--space-4)}
    h1{font-size:var(--text-3xl);margin-top:0}h2{font-size:var(--text-2xl)}h3{font-size:var(--text-xl)}
    h1:lang(zh),h2:lang(zh),h3:lang(zh){font-family:var(--tdf-font-display-zh);font-weight:700;line-height:var(--tdf-leading-display-zh);letter-spacing:var(--tdf-tracking-display-zh);text-transform:none}
    p,li{max-width:72ch}
    a{color:var(--fg-2);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
    a:hover{text-decoration-color:var(--accent)}
    blockquote{margin:var(--space-6) 0;padding:var(--space-4) var(--space-6);background:var(--surface-warm);border-left:var(--tdf-line) solid var(--border)}
    code{font-family:var(--font-mono);font-size:var(--text-sm);background:var(--surface);padding:0 var(--space-1)}
    pre{overflow:auto;padding:var(--space-4);background:var(--surface);border:3px solid var(--border)}
    pre code{background:none;padding:0}
    table{width:100%;border-collapse:collapse;margin:var(--space-6) 0;font-size:var(--text-base)}
    th,td{text-align:left;padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--border-soft);vertical-align:top}
    thead th{background:var(--surface);font-size:var(--text-sm);letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid var(--border)}
    hr{border:0;border-top:var(--tdf-line) solid var(--border);margin:var(--space-12) 0}
    img{max-width:100%}
    .table-wrap{overflow-x:auto}
    @media (max-width:639px){:root{--tdf-line:var(--tdf-line-mobile)}main{padding:var(--space-6) var(--container-gutter-phone) var(--section-y-phone)}article{padding:var(--space-5)}}
  </style>
</head>
<body>
  <nav class="nav" aria-label="Site"><a href="./"><img src="design-system/assets/favicon.svg" alt=""><b>TDF</b> 2027 CIS</a><a class="sub" href="./">Handbook</a><a class="sub" href="spec/品牌色彩計畫.md" download>Markdown</a><a class="sub" href="design-system/DESIGN.md">DESIGN.md</a></nav>
  <main><article id="doc"><p>Loading 品牌色彩計畫.md …</p></article></main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    fetch(encodeURI('spec/品牌色彩計畫.md')).then(r => r.text()).then(md => {
      const doc = document.getElementById('doc');
      doc.innerHTML = marked.parse(md);
      doc.querySelectorAll('h1,h2,h3').forEach(h => { if (/[一-鿿]/.test(h.textContent)) h.lang = 'zh'; });
      doc.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.append(t); });
      doc.querySelectorAll('a[href]').forEach(a => { const h = a.getAttribute('href'); if (h.includes('design/brand/cis.html')) a.href = './'; });
    }).catch(() => { document.getElementById('doc').innerHTML = '<p>無法載入規範，請改開 <a href="spec/品牌色彩計畫.md">Markdown 原檔</a>。</p>'; });
  </script>
</body>
</html>
